# Every track the site offers, and the ONLY place they are defined.
#
# site/config.json is generated from this file (scripts/lib/yamlspec.py) and is
# never edited by hand. Adding a track means adding an entry here and re-running
# ./build.sh.
#
# Schema notes that are easy to get wrong:
#   * `assemblyNames` in config.json comes from `assembly` here.
#   * The session addresses a display by <track id>-<display type>; that id is
#     DERIVED at build time, so do not hand-write displayId.
#   * Feature displays take `renderer` (singular, a typed object);
#     wiggle/manhattan displays take `renderers` (plural, keyed by type name).
#     Mixing them silently yields an unconfigured renderer.
#   * `adapter` locations are repo-relative; the generator rewrites them into
#     UriLocation objects rooted at the site.

defaults:
  assembly: pombe

tracks:
  # ---------------------------------------------------------------- reference
  - id: pombe_genes
    name: PomBase genes
    type: FeatureTrack
    category: [Reference]
    adapter:
      type: Gff3TabixAdapter
      gffGzLocation: data/annotation/pombe.gff.gz
      index:
        indexType: TBI
        location: data/annotation/pombe.gff.gz.tbi
    displays:
      - type: LinearBasicDisplay
        height: 200
        renderer:
          type: SvgFeatureRenderer      # alias for CanvasFeatureRenderer
          # GFF3 attribute names arrive LOWERCASED -- PomBase's `ID=` and `Name=`
          # become `id` and `name`. An expression naming them `ID`/`Name`/`gene_id`
          # evaluates to the empty string, and the renderer then draws no label
          # at all, with no error anywhere. Confirmed by clicking a feature and
          # reading the detail panel.
          labels:
            name: jexl:get(feature,'name') || get(feature,'id')


  # ------------------------------------------------- DIT-HAP insertion tracks
  # GENERATED by `python3 scripts/20_tracks.py --emit-tracks`, which writes the
  # BED files these entries name. Regenerate both together; an entry whose
  # bedGzLocation does not exist renders as a track that never leaves "Loading".
  #
  # One track per dataset / quantity / time point, from the release tables:
  # fitting_results.tsv -> DR, DL; LFC.tsv -> one per non-baseline time point.
  # The baseline time point (YES0, or 0h / Spikein0) has an LFC of exactly zero
  # at every insertion, so it is a flat line by construction and gets no track.
  #
  # Coordinates: the pipeline writes `Coordinate = R1_Ref_Start + 4` for the +
  # strand and `R1_Ref_End` for the -, both straight from pysam and therefore
  # 0-BASED. The TTAA motif occupies [Coordinate-4, Coordinate). Verified against
  # data/assembly/pombe.fa.gz: 96.2% of sampled rows read TTAA, matching the
  # Target column, where a 1-based reading scores 1.3%. BED is 0-based
  # half-open, so each feature is [Coordinate, Coordinate+1).
  #
  # minScore/maxScore are FIXED and shared across datasets so time points and
  # datasets can be compared by eye; see the AXIS table in scripts/20_tracks.py
  # for how the values were chosen. They ARE honoured: the vendored display
  # defaults to autoscale: local, and rendering one BED under -2.2..1.1 and again
  # under -100..100 gives a scattered cloud and a flat line respectively. Points
  # outside the domain clamp to the edge rather than erroring.
  #
  # NO DENSITY GUARD, unlike the feature tracks. The vendored
  # LinearManhattanDisplay overrides `regionTooLarge` to return false, so these
  # never show "Zoom in to see features" and never wait for a FORCE LOAD -- they
  # fetch and draw at any zoom, including the whole genome. The cost is
  # bandwidth: at whole-genome zoom each enabled track downloads its entire BED.
  # Measured against the built site: 18 tracks on at once moved 24.9 MB of BED
  # (57.8 MB including the app), still painting in ~6 s. At gene scale the same
  # tracks fetch a few kB each. The track selector is the only control.
  - id: hd_dit_hap_dr
    name: Depletion rate (DR)
    type: GWASTrack
    category: [HD DIT-HAP, Curve fit]
    adapter:
      type: GWASAdapter
      bedGzLocation: data/tracks/hd_dit_hap/DR.bed.gz
      index: {indexType: TBI, location: data/tracks/hd_dit_hap/DR.bed.gz.tbi}
    displays:
      - type: LinearManhattanDisplay
        height: 160
        minScore: -2.2
        maxScore: 1.1
        renderers:
          LinearManhattanRenderer:
            color: "jexl:get(feature,'strand')==1?'darkred':'darkblue'"

  - id: hd_dit_hap_dl
    name: Depletion lag (DL)
    type: GWASTrack
    category: [HD DIT-HAP, Curve fit]
    adapter:
      type: GWASAdapter
      bedGzLocation: data/tracks/hd_dit_hap/DL.bed.gz
      index: {indexType: TBI, location: data/tracks/hd_dit_hap/DL.bed.gz.tbi}
    displays:
      - type: LinearManhattanDisplay
        height: 160
        minScore: 0
        maxScore: 16.2
        renderers:
          LinearManhattanRenderer:
            color: "jexl:get(feature,'strand')==1?'darkred':'darkblue'"

  - id: hd_dit_hap_lfc_yes1
    name: Log2 fold change YES1
    type: GWASTrack
    category: [HD DIT-HAP, LFC]
    adapter:
      type: GWASAdapter
      bedGzLocation: data/tracks/hd_dit_hap/LFC_YES1.bed.gz
      index: {indexType: TBI, location: data/tracks/hd_dit_hap/LFC_YES1.bed.gz.tbi}
