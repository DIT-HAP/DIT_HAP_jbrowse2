  # ------------------------------------------------- Kuang et al. 2017 (IsoSeq)
  # A published PacBio IsoSeq time course of meiosis, MIRRORED into
  # data/external/kuang/ by scripts/15_external.sh rather than linked.
  #
  # These were linked until the round trip proved too slow to browse. PomBase
  # serves at 70-130 kB/s, so a single 1 MB range read measured 8-14 s, and an
  # AlignmentsTrack issues several per view. The same bytes from the site's own
  # origin cost nothing. Mirroring redistributes someone else's data, which is
  # why every track below keeps the citation, study accession, sample and source
  # URL in its `metadata`, and config/external.yaml records the upstream URL and
  # a checksum for each mirrored file.
  #
  # Scope, established by probing rather than from the paper: only rep2 exists --
  # every rep1 filename is a 404 -- and the series is 0,2,4,6,8,10 h. PomBase's
  # own ids are 27856494-rep2_meiosis_hour_<N>_sorted; these follow this
  # repository's naming, and the track ids are what a saved session stores, so
  # renaming one orphans that entry in every visitor's saved session.
  #
  # The BAM headers name the same six sequences as our assembly at the same
  # lengths, so alignments land in the right place. The single exception is
  # mitochondrial: the BAMs say 19,431 bp where our FASTA says 19,433. Only that
  # one 19 kb sequence can be off, and only by the two bases.
  #
  # PomBase's entries carry no `displays`, so these carry only what is needed to
  # colour by strand and nothing else: an entry naming LinearAlignmentsDisplay,
  # which IS the stock display JBrowse would have supplied for an AlignmentsTrack
  # anyway (AlignmentsTrack registers it as its own display type), with `colorBy`
  # set on its pileup sub-display. Everything the display would have defaulted to
  # it still defaults to.
  #
  # `colorBy` is a frozen slot, and `{type: strand}` is its shape, not a typo for
  # a bare string -- the accepted values live on the pileup display model, which
  # switches on `colorBy.type` (normal, strand, mappingQuality, pairOrientation,
  # tag, insertSize, modifications, ...). Anything unrecognised falls through to
  # the renderer's plain `color`.
  #
  # The `displayId` inside `pileupDisplay` looks redundant and is not. Every
  # display config schema is declared with `explicitIdentifier: 'displayId'`, so
  # it is an MST `types.identifier` and the config tree cannot be built without
  # it -- a sub-display block carrying only `type` (or only `colorBy`) throws
  # while the track is being added. The error says nothing about any of this: it
  # surfaces as `Reaction[AlignmentsDisplayConfig] Error: no containing track
  # found`, from an autorun that runs on a half-built tree, followed by a cascade
  # about `PileupDisplay` being undefined. The value is then overwritten anyway
  # -- the parent builds its pileup config as `{...getConf(self,'pileupDisplay'),
  # type: lowerPanelType, displayId: `${parentDisplayId}_${lowerPanelType}_xyz`}`
  # -- so all six tracks share one string here, and only its presence matters.
  #
  # These DO have the fetch-size guard that the manhattan tracks lack, because it
  # is a different mechanism: `fetchSizeLimit` (1 MB default) rejects a single
  # fetch that returns too many records, where `regionTooLarge` refuses a whole
  # zoom level by feature density. The IsoSeq libraries are deep, so at a 25 kb
  # window the 10 h track asks for 5.29 MB and shows "Requested too much data --
  # zoom in or force load" rather than rendering. That is the stock behaviour and
  # the FORCE LOAD button resolves it; raising `fetchSizeLimit` here would just
  # move the same bytes without asking.

