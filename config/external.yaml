# Third-party datasets mirrored into this repository.
#
# scripts/15_external.sh downloads each file below into data/external/<dir>/ and
# verifies its checksum. The bytes are committed, like the reference layer and
# the DIT-HAP tracks, so the deployed site serves them from its own origin.
#
# Why mirror rather than link: PomBase delivers at 70-130 kB/s, measured
# 2026-10-15 -- a single 1 MB range read took 8-14 s, and an AlignmentsTrack
# issues several per view, so the tracks were visibly slow to open. Serving the
# same bytes ourselves removes that wait.
#
# Mirroring redistributes someone else's data, which is why `source` and the
# per-file checksums are load-bearing rather than decoration: they are what lets
# the shipped bytes be traced back and re-derived. The citation, sample and
# conditions also sit on every track's `metadata` in config/tracks.yaml, which
# is what JBrowse shows under "About this track".
#
# To add a file, leave its `sha256` empty and run ./build.sh data: the download
# stage fetches it and prints the checksum to paste back in here.

