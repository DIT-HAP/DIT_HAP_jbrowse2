# The default session: what a first-time visitor sees.
#
# JBrowse 2 has no grid layout -- multiple views are stacked vertically as
# full-width panels. This site therefore uses a SINGLE view whose
# displayedRegions lists every sequence, which lays the chromosomes out side by
# side under one coordinate system (the native JBrowse "whole genome" form).
# A multi-region view renders correctly for both the manhattan and bigWig
# renderers; that was verified against JBrowse 2 v4.3.0 before choosing it.
#
# Returning visitors keep whatever session their browser stored in IndexedDB,
# so this only governs the first visit. site/docs links to per-chromosome
# sessions for anyone who wants one sequence at full width.

# Plugin configuration. Unlike `session:` below, this lands in config.json's
# top-level "configuration", which JBrowse reads for EVERY view -- including
# views inside a session a returning visitor already has stored.
configuration:
  LinearGenomeViewPlugin:
    # Where a track's name is drawn. "overlapping" (the JBrowse default) paints
    # it over the track's own canvas; "offset" reserves a row for it above the
    # track; "hidden" drops it.
    #
    # Measured at a 1400px viewport with one gene track: offset starts the track
    # body at y=193, overlapping starts it at y=166 and draws the label across
    # the first 15px of data. Gene names land in that top-left corner, so under
    # overlapping they sit on top of the leftmost features.
    #
    # It has to be set here rather than in a saved session: the view reads
    # `view.trackLabels || <this>`, so a session that does not set it -- which
    # is every session, ours included -- falls through to this value.
    trackLabels: offset

session:
  name: DIT-HAP browser

  views:
    - id: genome
      regions: all            # expands to assembly.chrom_order, in that order

      # bpPerPx is stored as an absolute value, so a saved session cannot be
      # "fit to width". Assume this many usable pixels: wider windows get a
      # little slack, narrower ones clip the final sequence slightly.
      assume_width_px: 1320

      # Track ids from config/tracks.yaml, in display order. A view with no
      # tracks is legitimate but lands the visitor on an empty ruler reading
      # "No tracks active", so the reference genes go in by default and the
      # DIT-HAP insertion tracks are switched on from the track selector.
      #
      # Expect this track to read "Zoom in to see features or force load" at
      # the whole-genome zoom below -- that is JBrowse's density guard, not a
      # broken track. See the ZOOM GUARD note in config/tracks.yaml.
      tracks:
        - pombe_genes
