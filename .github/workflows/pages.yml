name: Deploy to GitHub Pages

# Builds site/ from the committed data + config and publishes it. No
# bioinformatics tooling runs here: the reference layer and the tracks are
# committed artefacts, produced locally by `./build.sh data`. That keeps the
# deploy path short and reproducible.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # yamlspec.py reads config/*.yaml; it is the only Python dependency.
      - name: Install build dependencies
        run: |
          npm install -g @jbrowse/cli@4.3.0
          python3 -m pip install --upgrade pyyaml

      - name: Show tool versions
        run: |
          jbrowse --version
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: Build site
        run: ./build.sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
